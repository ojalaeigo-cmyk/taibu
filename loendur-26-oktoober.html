<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tööle saamiseni on jäänud</title><style>body{background:#091222;color:#eafff4;font:16px system-ui;margin:0;min-height:100vh;display:grid;place-items:center}main{max-width:680px;width:90%;text-align:center}h1{font-size:clamp(26px,6vw,44px)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}section{padding:30px 12px;background:#142339;border:1px solid #35526a;border-radius:24px}.cell{padding:20px 3px;background:#0a1529;border-radius:12px}.v{font-size:clamp(25px,6vw,58px);font-weight:800;color:#b6ffe4}.u{color:#acc0d4;font-size:12px}.sub{color:#b4c8d7}.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}button,a{border:1px solid #35735d;border-radius:9px;padding:11px 14px;color:#ecfff4;background:#17483a;font:600 14px system-ui;cursor:pointer;text-decoration:none}a{background:#207b4f}small{color:#98abc2;display:block;margin-top:24px}@media(max-width:380px){section{padding:16px 7px}.v{font-size:26px}}</style></head><body><main><p class="sub">REAALAJAS LOENDUR · EESTI AEG</p><h1>Tööle saamiseni on jäänud</h1><p class="sub" id="desc">Aega 26. oktoobri lõpuni</p><section><div class="grid"><div class="cell"><div class="v" id="d">–</div><div class="u">päeva</div></div><div class="cell"><div class="v" id="h">–</div><div class="u">tundi</div></div><div class="cell"><div class="v" id="m">–</div><div class="u">minutit</div></div><div class="cell"><div class="v" id="s">–</div><div class="u">sekundit</div></div></div><p class="sub" id="status">Loendur käib</p></section><div class="actions"><button id="start">26.10 algus · 00:00</button><button id="end">26.10 lõpp · 23:59</button><a id="share">Jaga WhatsAppis</a></div><small>Uueneb iga sekund. Arvestab Eesti suveaja lõppu 25.10.2026.</small></main><script>const target={start:Date.parse("2026-10-26T00:00:00+02:00"),end:Date.parse("2026-10-27T00:00:00+02:00")};let mode="end";const g=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0");function render(){let left=Math.max(0,Math.ceil((target[mode]-Date.now())/1000));g("d").textContent=Math.floor(left/86400);g("h").textContent=pad(Math.floor(left%86400/3600));g("m").textContent=pad(Math.floor(left%3600/60));g("s").textContent=pad(left%60);g("status").textContent=left?"Loendur käib · reaalajas":"Sihtaeg on käes!";g("desc").textContent="Aega 26. oktoobri "+(mode==="end"?"lõpuni":"alguseni");}g("start").onclick=()=>{mode="start";render()};g("end").onclick=()=>{mode="end";render()};g("share").href="https://api.whatsapp.com/send?text="+encodeURIComponent("26. oktoobri reaalajas loendur: "+location.href);render();setInterval(render,250);</script></body></html>
